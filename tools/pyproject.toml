# The stub generator is its own project, deliberately separate from the repo root:
# it runs on the current interpreter, while the stubs and their tests are checked
# against the Python version embedded in Sublime Text. One project cannot express
# both targets, so `tools/` carries its own lockfile, virtualenv and checker config.

[project]
name = "sublime-text-stubs-tools"
version = "0"
description = "Stub generator for sublime-text-stubs; checked independently of the stubs."
requires-python = ">=3.14"

[dependency-groups]
dev = ["basedpyright", "ruff"]

[tool.uv]
# Virtual project: only the dependency groups are installed, never the code itself.
package = false

# Unlike the repo root, this targets the interpreter the tools actually run on, and
# nothing is relaxed: `all` puts every basedpyright rule at `error`. Declaring the
# settings here rather than in a `pyrightconfig.json` keeps them basedpyright-only;
# note that basedpyright refuses to run when one file carries both a `[tool.pyright]`
# and a `[tool.basedpyright]` section.
[tool.basedpyright]
include = ["."]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.14"
typeCheckingMode = "all"

# Only `tools/` is linted with ruff; the repo root holds `.pyi` files and sample
# consumer code for the type checkers, which have their own conventions.
[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["**/__pycache__", ".venv"]

[tool.ruff.lint]
# A broad selection minus the families that fight this code rather than improve it:
# `D` (the docstring conventions collide with the reStructuredText prose lifted from
# the reference), `T20` (this is a CLI script, `print` is its output), `S` (`assert`
# is a fine internal invariant here), `EM`/`TRY` (message-in-exception ceremony),
# `FBT` (the boolean flags are keyword-only at every call site) and `COM`/`CPY`.
select = [
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "I",     # isort
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RUF",   # ruff-specific rules
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
