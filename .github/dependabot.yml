version: 2

updates:
  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment;
  # Dependabot rewrites both the SHA and that comment in place.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # The root and `tools/` are separate uv projects, each with its own lockfile.
  - package-ecosystem: uv
    directories: ["/", "/tools"]
    schedule:
      interval: monthly
    groups:
      dev-tools:
        patterns: ["*"]
