name: CI

on:
  push:
    branches: ["main", "st-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stubs-up-to-date:
    name: Stubs match the reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - run: uv sync --group dev

      - name: Regenerate the stubs and fail on drift
        run: uv run python tools/generate_stubs.py --check

  typecheck:
    name: ${{ matrix.checker }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checker: [pyright, basedpyright, mypy, ty]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - run: uv sync --group dev

      - name: Run ${{ matrix.checker }}
        run: |
          case "${{ matrix.checker }}" in
            pyright)      uv run pyright ;;
            basedpyright) uv run basedpyright ;;
            mypy)         uv run mypy ;;
            ty)           uv run ty check --error-on-warning ;;
          esac

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags

      - uses: astral-sh/setup-uv@v9

      - run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
