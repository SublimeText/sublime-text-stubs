name: CI

on:
  push:
    branches: ["main", "st-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stubs-up-to-date:
    name: Stubs match the reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Regenerate the stubs and fail on drift
        run: uv run python tools/generate_stubs.py --check

  typecheck:
    name: ${{ matrix.checker }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checker: [pyright, basedpyright, mypy, ty]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Run ${{ matrix.checker }}
        run: |
          case "${{ matrix.checker }}" in
            pyright)      uv run pyright ;;
            basedpyright) uv run basedpyright ;;
            mypy)         uv run mypy ;;
            ty)           uv run ty check --error-on-warning ;;
          esac

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Run ruff
        run: uv run ruff check --output-format=github

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
