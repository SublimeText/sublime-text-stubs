name: Release

on:
  push:
    tags: ["v*.*"]

permissions:
  contents: read

jobs:
  check-ci:
    name: Wait for CI to pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for the CI and Tools workflows to succeed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for workflow in CI Tools; do
            echo "Waiting for '$workflow' on $SHA..."
            conclusion=""
            for _ in $(seq 1 40); do
              conclusion=$(gh run list --repo "$REPO" --commit "$SHA" --workflow "$workflow" \
                --json conclusion,status --jq '.[0] | if .status == "completed" then .conclusion else "pending" end')
              case "$conclusion" in
                success) echo "$workflow succeeded."; break ;;
                pending|"") sleep 15 ;;
                *) echo "$workflow concluded with '$conclusion'."; exit 1 ;;
              esac
            done
            if [ "$conclusion" != success ]; then
              echo "Timed out waiting for $workflow to complete."
              exit 1
            fi
          done

  build:
    name: Build distribution
    needs: check-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - run: uv build

      - name: Fail if the built version does not match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls dist/sublime_text_stubs-"$tag"-py3-none-any.whl

      # Runs before publishing so that a missing changelog section stops the release early.
      - name: Extract the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            # Pre-releases get no section of their own; their changes stay under [Unreleased].
            *[a-z]*) heading='## [Unreleased]' ;;
            # The trailing " (" keeps e.g. 4200.1 from matching 1.4200.1.
            *) heading="## $version (" ;;
          esac
          awk -v heading="$heading" '
            index($0, "## ") == 1 { if (found) exit; found = index($0, heading) == 1; next }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no entries under '$heading'."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

      # Kept out of dist/, which the PyPI publish action uploads wholesale.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    name: Create draft GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME#v}" in
            *[a-z]*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md \
            "${flags[@]}"
