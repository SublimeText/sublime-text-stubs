name: Release

on:
  push:
    tags: ["v1.*.*"]

permissions:
  contents: read

jobs:
  check-ci:
    name: Wait for CI to pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for the CI and Tools workflows to succeed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for workflow in CI Tools; do
            echo "Waiting for '$workflow' on $SHA..."
            conclusion=""
            for _ in $(seq 1 40); do
              conclusion=$(gh run list --repo "$REPO" --commit "$SHA" --workflow "$workflow" \
                --json conclusion,status --jq '.[0] | if .status == "completed" then .conclusion else "pending" end')
              case "$conclusion" in
                success) echo "$workflow succeeded."; break ;;
                pending|"") sleep 15 ;;
                *) echo "$workflow concluded with '$conclusion'."; exit 1 ;;
              esac
            done
            if [ "$conclusion" != success ]; then
              echo "Timed out waiting for $workflow to complete."
              exit 1
            fi
          done

  build:
    name: Build distribution
    needs: check-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - run: uv build

      - name: Fail if the built version does not match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls dist/sublime_text_stubs-"$tag"-py3-none-any.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
